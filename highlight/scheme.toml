# Scheme (R7RS). Format: SPEC §5.6.
# Not handled: datum comments (#;) and |symbols| (a ; or " inside one
# starts a comment or a string).

extensions = ["scm", "ss", "sld", "sls", "sps"]
word-chars = "!$%&*/:<=>?^_~+-.@#"
line-comments = [";"]
numbers = true
char-prefixes = ["#\\"]

[[block-comments]]
open = "#|"
close = "|#"
nested = true

[[strings]]
open = "\""
close = "\""
escape = "\\"

[words]
keyword = [
  "and", "begin", "case", "case-lambda", "cond", "cond-expand", "define",
  "define-library", "define-record-type", "define-syntax", "define-values",
  "delay", "delay-force", "do", "else", "export", "guard", "if", "import",
  "include", "include-ci", "lambda", "let", "let*", "let*-values",
  "let-syntax", "let-values", "letrec", "letrec*", "letrec-syntax", "or",
  "parameterize", "quasiquote", "quote", "set!", "syntax-rules", "unless",
  "unquote", "unquote-splicing", "when", "=>", "...",
]
literal = ["#t", "#f", "#true", "#false"]
