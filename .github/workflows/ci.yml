name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  haskell:
    name: ${{ matrix.os }} / GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: macos-latest's ld can't read its own SDK (arm64e.x1 in .tbd
        # files). Go back to macos-latest once the image is fixed.
        os: [ubuntu-latest, macos-15]
        ghc: ['9.10', '9.12', '9.14']

    env:
      # A missing API fixture fails the golden tests instead of being
      # written. See Note [API fixtures] in HaskellReviewer.Server.Wire.
      TASTY_NO_CREATE: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      # Warnings are errors in CI only. In cabal.project.local, so that
      # `make install` below reuses the same build.
      - name: Turn warnings into errors
        run: |
          printf 'package haskell-reviewer\n  ghc-options: -Werror\n' > cabal.project.local

      - name: Plan
        run: cabal build all --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@v6
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ matrix.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ matrix.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ matrix.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}

      - name: Build
        run: make build

      # The tests need git 2.44 or newer. macOS has Apple's older git in
      # /usr/bin; Homebrew's should come first on PATH.
      - name: Git version
        run: |
          command -v git
          git --version

      - name: Test
        run: make test

      - name: Install
        run: |
          make install BINDIR="$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/haskell-reviewer" --version

      # Smoke test only (D-76): checks the benchmark harness itself
      # works, on the small reference project, with no timing checks.
      # One GHC is enough; the harness doesn't depend on which.
      - name: Cache the small reference project
        if: matrix.ghc == '9.14'
        uses: actions/cache@v6
        with:
          path: bench/projects/optparse-applicative
          key: bench-${{ runner.os }}-${{ hashFiles('bench/projects.txt') }}

      - name: Benchmark harness smoke test
        if: matrix.ghc == '9.14'
        run: make bench-smoke

  web:
    name: ${{ matrix.os }} / web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS too: the committed dist must match a build with the darwin
        # native packages (rolldown, lightningcss).
        os: [ubuntu-latest, macos-15]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # web/dist is committed. A rebuild must give the same files.
      - name: Bundle is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "web/dist differs from a fresh build. Run 'make web' and commit."
            git status --porcelain -- dist
            git diff --stat -- dist
            exit 1
          fi

      - name: Check bundle (CSP, no eval)
        run: npm run check:bundle

  # Browser end-to-end tests against the real binary (D-89). Linux only:
  # Playwright's WebKit is close enough to Safari, and macOS runners are
  # slow and scarce.
  e2e:
    name: ubuntu-latest / e2e
    runs-on: ubuntu-latest
    # No `needs: haskell`, so this job can't rely on that job's store
    # cache being ready yet. When cabal.project.freeze changes (e.g.
    # M1/T03a added ghc-lib-parser, alex, happy), this job may have to
    # build those few packages cold too (~5-10 min). 30 min was already
    # tight, so give it more room.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14'
          cabal-version: latest

      # Same build as the haskell job, so the store cache is shared.
      # Restore only: the haskell job saves it.
      - name: Turn warnings into errors
        run: |
          printf 'package haskell-reviewer\n  ghc-options: -Werror\n' > cabal.project.local

      - name: Plan
        run: cabal build all --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@v6
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ubuntu-latest-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ubuntu-latest-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies

      - name: Build
        run: make build

      - name: Git version
        run: git --version

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: make e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
